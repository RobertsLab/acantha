name: Satellite imagery

# Builds Sentinel-2 products (imagery/run.py) and publishes them to the
# `imagery-data` branch. update.yml copies that branch into web/data/imagery/
# on every deploy. The branch is a single force-pushed commit holding the
# current RETAIN_DAYS window, so repository history doesn't grow.

on:
  schedule:
    # S2 passes over the bay at ~19:10 UTC and scenes reach the catalogs a few hours later.
    - cron: "30 22 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # push imagery-data
  actions: write    # start a site deploy once products change

concurrency:
  group: imagery
  cancel-in-progress: false

jobs:
  imagery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get previous products
        run: |
          mkdir -p imagery-out
          if git fetch --depth 1 origin imagery-data; then
            git archive FETCH_HEAD | tar -x -C imagery-out
          else
            echo "No imagery-data branch yet; starting fresh."
          fi
          cp imagery-out/imagery.json /tmp/imagery-before.json 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: imagery/requirements.txt

      - run: pip install -r imagery/requirements.txt

      - name: Build products
        run: python imagery/run.py --out imagery-out

      - name: Publish to imagery-data
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only scene changes count (generated_at changes every run).
          strip() { python -c "import json,sys; d=json.load(open(sys.argv[1])); d.pop('generated_at',None); print(json.dumps(d,sort_keys=True))" "$1" 2>/dev/null; }
          if [ "$(strip imagery-out/imagery.json)" = "$(strip /tmp/imagery-before.json)" ]; then
            echo "No new scenes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cd imagery-out
          git init -q -b imagery-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Imagery products $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" imagery-data
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy site with new products
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update.yml --ref main
