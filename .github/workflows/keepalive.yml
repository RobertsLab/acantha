name: Keep scheduled workflows enabled

# GitHub disables scheduled workflows in a public repo after 60 days with no
# repository activity, which would silently stop the data updates, the briefing
# and the phone alerts. Re-enabling each workflow through the API resets that
# clock without adding commits. Runs twice a month, well inside the 60 days.

on:
  schedule:
    - cron: "17 9 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in update.yml imagery.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "enabled $wf"
          done
