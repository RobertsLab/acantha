name: Fetch data and deploy site

on:
  schedule:
    - cron: "*/20 * * * *"   # GitHub may delay scheduled runs by several minutes
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the sensor archive step pushes to the sensor-data branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch public data
        # Falls back to the currently published file for any source that fails.
        run: python ingest/fetch.py --out web/data --fallback-url "${{ steps.pages.outputs.base_url }}/data"
        env:
          # Farm sensors via The Things Network; unset until hardware is deployed.
          TTN_APP_ID: ${{ vars.TTN_APP_ID }}
          TTN_API_KEY: ${{ secrets.TTN_API_KEY }}

      - name: Archive sensor readings (sensor-data branch)
        # Permanent copy of every reading; the site keeps only 7 days. Never blocks the deploy.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin sensor-data; then
            git worktree add -B sensor-data ../archive FETCH_HEAD
          else
            git worktree add --detach ../archive
            git -C ../archive checkout --orphan sensor-data
            git -C ../archive rm -rfq .
          fi
          python ingest/archive_sensors.py web/data/sensors.json ../archive
          git -C ../archive add -A
          if git -C ../archive diff --cached --quiet; then
            echo "No new sensor readings."
          else
            git -C ../archive commit -qm "Sensor readings to $(date -u +%Y-%m-%dT%H:%MZ)"
            git -C ../archive push origin sensor-data
          fi

      - name: Add satellite imagery (hidden; built by imagery.yml)
        run: |
          if git fetch --depth 1 origin imagery-data; then
            mkdir -p web/data/imagery
            git archive FETCH_HEAD | tar -x -C web/data/imagery
          else
            echo "No imagery-data branch yet."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
