name: Fetch data and deploy site

on:
  schedule:
    - cron: "*/20 * * * *"   # GitHub may delay scheduled runs by several minutes
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch public data
        # Falls back to the currently published file for any source that fails.
        run: python ingest/fetch.py --out web/data --fallback-url "${{ steps.pages.outputs.base_url }}/data"
        env:
          # Farm sensors via The Things Network; unset until hardware is deployed.
          TTN_APP_ID: ${{ vars.TTN_APP_ID }}
          TTN_API_KEY: ${{ secrets.TTN_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
